<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">UNIVERSITY DETAIL | Scolars Lift</title>
  <meta name="description"
    content="Explore complete details of our partner universities including courses, fees, admission process, facilities and placement.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&amp;display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css?v=1781470800989">

  <style>
    /* ==========================================
       UNIVERSITY PAGE USES HOMEPAGE TOKENS
       All colors reference CSS vars from style.css
    ========================================== */

    /* PAGE LOADER */
    .page-loader {
      position: fixed;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .page-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loader-ring {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(255, 193, 7, 0.2);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loader-text {
      font-size: 13px;
      color: var(--text-grey);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: var(--font-main);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* HERO BANNER light variant matching homepage style */
    .uni-hero-banner {
      background: linear-gradient(135deg, var(--secondary-color) 0%, #006655 100%);
      position: relative;
      padding: 70px 0 55px;
      overflow: hidden;
    }

    .uni-hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.07) 1px, transparent 0);
      background-size: 36px 36px;
    }

    .hero-banner-inner {
      position: relative;
      z-index: 2;
    }

    .uni-breadcrumb {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .uni-breadcrumb a {
      color: var(--primary-color);
      text-decoration: none;
    }

    .uni-breadcrumb a:hover {
      text-decoration: underline;
    }

    .uni-breadcrumb span {
      color: rgba(255, 255, 255, 0.4);
      margin: 0 8px;
    }

    .hero-main {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .uni-logo-wrap {
      width: 100px;
      height: 100px;
      background: var(--white);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .uni-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hero-text {
      flex: 1;
      min-width: 220px;
    }

    .uni-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 193, 7, 0.18);
      border: 1px solid rgba(255, 193, 7, 0.4);
      color: var(--primary-color);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    .uni-hero-name {
      font-size: clamp(26px, 4.5vw, 46px);
      font-weight: 900;
      line-height: 1.15;
      color: var(--white);
      margin-bottom: 8px;
      animation: slideUp 0.5s ease 0.1s both;
    }

    .uni-tagline {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.65);
      font-style: italic;
      animation: slideUp 0.5s ease 0.2s both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 22px;
      animation: slideUp 0.5s ease 0.3s both;
    }

    .hero-meta-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
    }

    .hero-meta-item i {
      color: var(--primary-color);
    }

    /* QUICK STATS BAR */
    .stats-bar-wrap {
      background: var(--white);
      border-bottom: 1px solid #f0f0f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .stats-bar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .stat-bar-item {
      padding: 22px 16px;
      text-align: center;
      border-right: 1px solid #f0f0f0;
      transition: 0.3s;
    }

    .stat-bar-item:last-child {
      border-right: none;
    }

    .stat-bar-item:hover {
      background: #FFFBF0;
    }

    .stat-bar-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .stat-bar-label {
      font-size: 11px;
      color: var(--text-grey);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* SECTION NAV PILLS */
    .section-nav-wrap {
      background: var(--bg-light);
      border-bottom: 1px solid #ebebeb;
      padding: 0;
      position: sticky;
      top: 70px;
      z-index: 90;
    }

    .section-nav-inner {
      display: flex;
      gap: 0;
      overflow-x: auto;
    }

    .section-nav-inner::-webkit-scrollbar {
      height: 2px;
    }

    .section-nav-inner a {
      padding: 14px 22px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-grey);
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: 0.3s;
    }

    .section-nav-inner a:hover {
      color: var(--primary-dark);
      border-bottom-color: var(--primary-dark);
      background: rgba(255, 152, 0, 0.04);
    }

    /* MAIN LAYOUT */
    .uni-main {
      padding: 50px 0 80px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 30px;
    }

    /* SECTION CARD */
    .uni-section {
      background: var(--white);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      animation: fadeInUp 0.4s ease both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .uni-section:nth-child(1) {
      animation-delay: 0.05s;
    }

    .uni-section:nth-child(2) {
      animation-delay: 0.10s;
    }

    .uni-section:nth-child(3) {
      animation-delay: 0.15s;
    }

    .uni-section:nth-child(4) {
      animation-delay: 0.20s;
    }

    .uni-section:nth-child(5) {
      animation-delay: 0.25s;
    }

    .uni-section:nth-child(6) {
      animation-delay: 0.30s;
    }

    .uni-section:nth-child(7) {
      animation-delay: 0.35s;
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 28px;
      border-bottom: 1px solid #f4f4f4;
      background: #FAFAFA;
    }

    .section-head-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--white);
      flex-shrink: 0;
    }

    .section-head h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-dark);
      font-family: var(--font-main);
    }

    .section-body {
      padding: 28px;
    }

    /* ABOUT */
    .about-text {
      font-size: 15px;
      line-height: 1.85;
      color: var(--text-grey);
    }

    .accreditation-note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-grey);
      background: #FFFBF0;
      padding: 12px 18px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-color);
    }

    .accreditation-note strong {
      color: var(--primary-dark);
    }

    /* RANKINGS */
    .ranking-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .ranking-item {
      background: var(--bg-light);
      border: 1px solid #ebebeb;
      border-radius: var(--border-radius);
      padding: 18px 20px;
      transition: 0.3s;
    }

    .ranking-item:hover {
      border-color: var(--primary-color);
      transform: translateY(-3px);
      box-shadow: var(--shadow-soft);
    }

    .ranking-label {
      font-size: 11px;
      color: var(--text-grey);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .ranking-value {
      font-size: 17px;
      font-weight: 800;
      color: var(--secondary-color);
    }

    /* COURSES TABLE */
    .courses-table {
      width: 100%;
      border-collapse: collapse;
    }

    .courses-table th {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-grey);
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid #f0f0f0;
      background: #FAFAFA;
    }

    .courses-table td {
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid #f8f8f8;
      color: var(--text-grey);
    }

    .courses-table tr:last-child td {
      border-bottom: none;
    }

    .courses-table tr {
      transition: 0.2s;
    }

    .courses-table tr:hover td {
      background: #FFFBF0;
    }

    .course-name {
      font-weight: 600;
      color: var(--text-dark) !important;
    }

    .course-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 77, 64, 0.08);
      color: var(--secondary-color);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 50px;
    }

    /* FEES */
    .fees-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .fee-item {
      background: var(--bg-light);
      border: 1px solid #ebebeb;
      border-radius: var(--border-radius);
      padding: 18px 20px;
      transition: 0.3s;
    }

    .fee-item:hover {
      border-color: var(--primary-color);
      box-shadow: var(--shadow-soft);
    }

    .fee-item.full-width {
      grid-column: 1 / -1;
    }

    .fee-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-grey);
      margin-bottom: 8px;
    }

    .fee-value {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .fee-note {
      font-size: 13px;
      color: var(--text-grey);
      margin-top: 8px;
      line-height: 1.7;
    }

    /* ADMISSION STEPS */
    .admission-steps {
      display: flex;
      flex-direction: column;
    }

    .step-item {
      display: flex;
      gap: 20px;
      padding-bottom: 28px;
      position: relative;
    }

    .step-item:last-child {
      padding-bottom: 0;
    }

    .step-item:last-child .step-line {
      display: none;
    }

    .step-num-wrap {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-num {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      color: var(--white);
      box-shadow: 0 6px 18px rgba(255, 152, 0, 0.3);
    }

    .step-line {
      width: 2px;
      flex: 1;
      margin-top: 8px;
      background: linear-gradient(to bottom, rgba(255, 193, 7, 0.5), rgba(255, 193, 7, 0.05));
    }

    .step-content {
      padding-top: 8px;
    }

    .step-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .step-desc {
      font-size: 14px;
      color: var(--text-grey);
      line-height: 1.7;
    }

    /* FACILITIES */
    .facilities-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .facility-item {
      background: var(--bg-light);
      border: 1px solid #ebebeb;
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: 0.3s;
    }

    .facility-item:hover {
      border-color: var(--primary-color);
      transform: translateY(-3px);
      box-shadow: var(--shadow-soft);
    }

    .facility-icon {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      background: #FFF8E1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--primary-dark);
      transition: 0.3s;
    }

    .facility-item:hover .facility-icon {
      background: var(--primary-color);
      color: var(--white);
    }

    .facility-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .facility-desc {
      font-size: 13px;
      color: var(--text-grey);
      line-height: 1.6;
    }

    /* PLACEMENT */
    .placement-rate-banner {
      background: linear-gradient(135deg, rgba(0, 77, 64, 0.07), rgba(0, 77, 64, 0.03));
      border: 1px solid rgba(0, 77, 64, 0.15);
      border-radius: var(--border-radius);
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 20px;
    }

    .placement-rate-num {
      font-size: 52px;
      font-weight: 900;
      color: var(--secondary-color);
      line-height: 1;
    }

    .placement-rate-text {
      font-size: 14px;
      color: var(--text-grey);
    }

    .placement-rate-text strong {
      display: block;
      color: var(--text-dark);
      font-size: 16px;
      margin-bottom: 4px;
    }

    .salary-range {
      background: #FFFBF0;
      border: 1px solid rgba(255, 193, 7, 0.3);
      border-radius: var(--border-radius);
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .salary-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-grey);
    }

    .salary-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
      margin-top: 5px;
    }

    .recruiters-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .recruiter-tag {
      background: rgba(0, 77, 64, 0.07);
      border: 1px solid rgba(0, 77, 64, 0.15);
      color: var(--secondary-color);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      transition: 0.3s;
    }

    .recruiter-tag:hover {
      background: var(--secondary-color);
      color: var(--white);
    }

    .alumni-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-grey);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .alumni-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .alumni-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-grey);
    }

    .alumni-item::before {
      content: '';
      width: 7px;
      height: 7px;
      background: var(--primary-color);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* SIDEBAR */
    .sidebar {
      position: sticky;
      top: 112px;
      height: fit-content;
    }

    .sidebar-card {
      background: var(--white);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      margin-bottom: 20px;
      animation: fadeInUp 0.4s ease 0.35s both;
    }

    .sidebar-head {
      padding: 18px 22px;
      border-bottom: 1px solid #f4f4f4;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      background: #FAFAFA;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-head i {
      color: var(--primary-dark);
    }

    .sidebar-body {
      padding: 20px 22px;
    }

    /* CONTACT LINKS */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      padding: 13px 16px;
      background: var(--bg-light);
      border: 1px solid #ebebeb;
      border-radius: var(--border-radius);
      transition: 0.3s;
    }

    .contact-link:hover {
      border-color: var(--primary-color);
      transform: translateX(4px);
      box-shadow: var(--shadow-soft);
    }

    .contact-link-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      background: #FFF8E1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--primary-dark);
      transition: 0.3s;
    }

    .contact-link:hover .contact-link-icon {
      background: var(--primary-color);
      color: var(--white);
    }

    .cl-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-grey);
    }

    .cl-val {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dark);
      word-break: break-all;
      margin-top: 2px;
    }

    .contact-address {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 13px 16px;
      background: var(--bg-light);
      border: 1px solid #ebebeb;
      border-radius: var(--border-radius);
    }

    /* APPLY CTA */
    .apply-cta {
      background: linear-gradient(135deg, var(--secondary-color) 0%, #006655 100%);
      border-radius: var(--border-radius);
      padding: 28px;
      text-align: center;
      animation: fadeInUp 0.4s ease 0.40s both;
      box-shadow: 0 10px 30px rgba(0, 77, 64, 0.2);
    }

    .apply-cta h3 {
      font-size: 20px;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 8px;
    }

    .apply-cta p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .apply-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, var(--primary-color), var(--primary-dark));
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 13px 28px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.35);
    }

    .apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 152, 0, 0.45);
    }

    /* RELATED QUICK INFO */
    .quick-info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quick-info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      background: var(--bg-light);
      border-radius: 8px;
      font-size: 13px;
    }

    .qi-label {
      color: var(--text-grey);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qi-label i {
      color: var(--primary-dark);
      width: 16px;
    }

    .qi-val {
      color: var(--text-dark);
      font-weight: 700;
    }

    /* ERROR STATE */
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 40px;
    }

    .error-page .error-icon {
      font-size: 72px;
      color: rgba(255, 193, 7, 0.3);
      margin-bottom: 22px;
    }

    .error-page h2 {
      font-size: 30px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .error-page p {
