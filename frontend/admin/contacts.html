<!DOCTYPE html><!-- scolars-era/frontend/admin/contacts.html --><html lang="en"><head>
    <meta name="description" content="Scholars Lift — Contacts SCOLARS LIFT Admin">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contacts SCOLARS LIFT Admin</title>
  <link rel="stylesheet" href="/assets/css/admin.css">

  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">
  <link rel="shortcut icon" href="/assets/images/favicon.png">

<style>
/* ── GUARANTEED GLOBAL FIXES ──────────────────────────────────────────────── */
.nav-item.has-dropdown {
    position: relative !important;
}
.nav-dropdown {
    position: absolute !important;
    top: 100% !important;
    left: 0 !important;
    background: #ffffff !important;
    border-radius: 8px !important;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
    min-width: 220px !important;
    padding: 10px 0 !important;
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateY(10px) !important;
    transition: all 0.3s ease !important;
    z-index: 9999 !important;
    display: block !important;
    list-style: none !important;
    margin: 0 !important;
}
.nav-item.has-dropdown:hover .nav-dropdown {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
}
.nav-dropdown li a {
    display: block !important;
    padding: 10px 20px !important;
    color: #333 !important;
    text-decoration: none !important;
    font-weight: 500 !important;
    font-size: 15px !important;
    border-radius: 6px !important;
}
.nav-dropdown li a:hover {
    background: #f4fdfa !important;
    color: #0d5c4a !important;
}
.nav-dropdown li a .drop-title {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
}
.ticker-track {
    animation: tickerScroll 20s linear infinite !important;
}
@keyframes tickerScroll {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
}
.ticker-wrapper:hover .ticker-track {
    animation-play-state: paused !important;
}
</style>


<style>
/* ── SEAMLESS TICKER FIX ──────────────────────────────────────────────── */
.seamless-track {
    animation: seamlessScroll 25s linear infinite !important;
}
@keyframes seamlessScroll {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-50%, 0, 0); }
}
.ticker-wrapper:hover .seamless-track {
    animation-play-state: paused !important;
}
</style>

</head>
<body>
  <button class="sb-toggle" id="sbToggle" aria-label="Toggle menu">☰</button>
  <div class="sb-veil" id="sbVeil"></div>

  <div class="admin-wrap">
    <!-- SIDEBAR -->
    <aside class="sb" id="adminSb">
      <div class="sb-logo">
        <span class="sb-logo-icon">🎓</span>
        <div>
          <div class="sb-logo-name">SCOLARS LIFT</div>
          <div class="sb-logo-sub">Admin Panel</div>
        </div>
      </div>
      <nav class="sb-nav">
        <div class="sb-section">Main Menu</div>
        <a href="/admin/index.html" class="sb-link">
          <span class="sb-icon">📊</span>Dashboard
        </a>
        <a href="/admin/contacts.html" class="sb-link active">
          <span class="sb-icon">✉️</span>Contacts
        </a>
        <a href="/admin/courses.html" class="sb-link">
          <span class="sb-icon">📚</span>Courses
        </a>
        <a href="/admin/universities.html" class="sb-link">
          <span class="sb-icon">🏛️</span>Universities
        </a>
        <a href="/admin/testimonials.html" class="sb-link">
          <span class="sb-icon">⭐</span>Testimonials
        </a>
        <div class="sb-section" style="margin-top:.75rem">Site</div>
        <a href="/" target="_blank" class="sb-link">
          <span class="sb-icon">🌐</span>View Website
        </a>
      </nav>
      <div class="sb-footer">
        <button class="btn-signout" id="btnOut">↩ Sign Out</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <header class="topbar">
        <h1 class="topbar-title">Contact Inquiries</h1>
        <div class="topbar-right">
          <span class="user-badge">
            <span>👤</span>
            <span id="adminName">Admin</span>
          </span>
        </div>
      </header>

      <div class="admin-content">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="pending">
            Pending <span class="tab-n" id="cn-pending">0</span>
          </button>
          <button class="tab-btn" data-tab="read">
            Read <span class="tab-n" id="cn-read">0</span>
          </button>
          <button class="tab-btn" data-tab="replied">
            Replied <span class="tab-n" id="cn-replied">0</span>
          </button>
          <button class="tab-btn" data-tab="spam">
            Spam <span class="tab-n" id="cn-spam">0</span>
          </button>
          <button class="tab-btn" data-tab="resolved">
            Resolved <span class="tab-n" id="cn-resolved">0</span>
          </button>
        </div>

        <div class="s-card">
          <div class="tbl-wrap">
            <table class="admin-tbl">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Subject</th>
                  <th>Message</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="contacts-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- CONTACT DETAIL MODAL -->
  <div class="modal-overlay" id="contact-detail-modal">
    <div class="modal-box modal-lg">
      <div class="modal-hd">
        <h2>Contact Details</h2>
        <button class="btn-close" data-close="contact-detail-modal">✕</button>
      </div>
      <div class="modal-bd" id="contact-detail-body"></div>
      <div class="modal-ft">
        <button class="btn btn-ghost" data-close="contact-detail-modal">Close</button>
        <a id="contact-reply-link" href="/contact.html" class="btn btn-primary">Reply ✉️</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/admin-shared.js"></script>
  <script src="/assets/js/admin-contacts.js"></script>
































</body></html>
