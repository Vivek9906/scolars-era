<!DOCTYPE html>
<!-- scolars-era/frontend/admin/index.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — SCOLARS LIFT Admin</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <button class="sb-toggle" id="sbToggle" aria-label="Toggle menu">☰</button>
  <div class="sb-veil" id="sbVeil"></div>

  <div class="admin-wrap">
    <!-- SIDEBAR -->
    <aside class="sb" id="adminSb">
      <div class="sb-logo">
        <span class="sb-logo-icon">🎓</span>
        <div>
          <div class="sb-logo-name">SCOLARS LIFT</div>
          <div class="sb-logo-sub">Admin Panel</div>
        </div>
      </div>
      <nav class="sb-nav">
        <div class="sb-section">Main Menu</div>
        <a href="/admin/index.html" class="sb-link active">
          <span class="sb-icon">📊</span>Dashboard
        </a>
        <a href="/admin/contacts.html" class="sb-link">
          <span class="sb-icon">✉️</span>Contacts
        </a>
        <a href="/admin/courses.html" class="sb-link">
          <span class="sb-icon">📚</span>Courses
        </a>
        <a href="/admin/universities.html" class="sb-link">
          <span class="sb-icon">🏛️</span>Universities
        </a>
        <a href="/admin/testimonials.html" class="sb-link">
          <span class="sb-icon">⭐</span>Testimonials
        </a>
        <div class="sb-section" style="margin-top:.75rem">Site</div>
        <a href="/" target="_blank" class="sb-link">
          <span class="sb-icon">🌐</span>View Website
        </a>
      </nav>
      <div class="sb-footer">
        <button class="btn-signout" id="btnOut">↩ Sign Out</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <header class="topbar">
        <h1 class="topbar-title">Dashboard</h1>
        <div class="topbar-right">
          <span class="user-badge">
            <span>👤</span>
            <span id="adminName">Admin</span>
          </span>
        </div>
      </header>

      <div class="admin-content">
        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-ico blue">📚</div>
            <div>
              <div class="stat-num" id="stat-courses">—</div>
              <div class="stat-lbl">Total Courses</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-ico orange">✉️</div>
            <div>
              <div class="stat-num" id="stat-messages">—</div>
              <div class="stat-lbl">New Messages</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-ico green">🏛️</div>
            <div>
              <div class="stat-num" id="stat-universities">—</div>
              <div class="stat-lbl">Universities</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-ico purple">⭐</div>
            <div>
              <div class="stat-num" id="stat-testimonials">—</div>
              <div class="stat-lbl">Testimonials</div>
            </div>
          </div>
        </div>

        <!-- Recent contacts -->
        <div class="s-card">
          <div class="s-head">
            <span class="s-title">📬 Recent Contacts</span>
            <a href="/admin/contacts.html" class="btn btn-ghost btn-sm">View All →</a>
          </div>
          <div class="tbl-wrap">
            <table class="admin-tbl">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Subject</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="recent-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/admin-shared.js"></script>
  <script src="/assets/js/admin-dashboard.js"></script>
</body>
</html>
