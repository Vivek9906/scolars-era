<!DOCTYPE html>
<!-- scolars-era/frontend/admin/testimonials.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Testimonials — SCOLARS LIFT Admin</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
  <button class="sb-toggle" id="sbToggle" aria-label="Toggle menu">☰</button>
  <div class="sb-veil" id="sbVeil"></div>

  <div class="admin-wrap">
    <!-- SIDEBAR -->
    <aside class="sb" id="adminSb">
      <div class="sb-logo">
        <span class="sb-logo-icon">🎓</span>
        <div>
          <div class="sb-logo-name">SCOLARS LIFT</div>
          <div class="sb-logo-sub">Admin Panel</div>
        </div>
      </div>
      <nav class="sb-nav">
        <div class="sb-section">Main Menu</div>
        <a href="/admin/index.html" class="sb-link">
          <span class="sb-icon">📊</span>Dashboard
        </a>
        <a href="/admin/contacts.html" class="sb-link">
          <span class="sb-icon">✉️</span>Contacts
        </a>
        <a href="/admin/courses.html" class="sb-link">
          <span class="sb-icon">📚</span>Courses
        </a>
        <a href="/admin/universities.html" class="sb-link">
          <span class="sb-icon">🏛️</span>Universities
        </a>
        <a href="/admin/testimonials.html" class="sb-link active">
          <span class="sb-icon">⭐</span>Testimonials
        </a>
        <div class="sb-section" style="margin-top:.75rem">Site</div>
        <a href="/" target="_blank" class="sb-link">
          <span class="sb-icon">🌐</span>View Website
        </a>
      </nav>
      <div class="sb-footer">
        <button class="btn-signout" id="btnOut">↩ Sign Out</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <header class="topbar">
        <h1 class="topbar-title">Manage Testimonials</h1>
        <div class="topbar-right">
          <span class="user-badge">
            <span>👤</span>
            <span id="adminName">Admin</span>
          </span>
        </div>
      </header>

      <div class="admin-content">
        <div class="s-card">
          <div class="s-head">
            <span class="s-title">
              ⭐ All Testimonials
              <span class="s-count" id="testi-count">0</span>
            </span>
            <button class="btn btn-primary" id="btnAddTesti">+ Add Testimonial</button>
          </div>
          <div class="tbl-wrap">
            <table class="admin-tbl">
              <thead>
                <tr>
                  <th>Avatar</th>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Rating</th>
                  <th>Featured</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="testi-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- TESTIMONIAL MODAL -->
  <div class="modal-overlay" id="testi-modal">
    <div class="modal-box modal-lg">
      <div class="modal-hd">
        <h2 id="testi-modal-title">Add Testimonial</h2>
        <button class="btn-close" data-close="testi-modal">✕</button>
      </div>
      <div class="modal-bd">
        <form id="testi-form" autocomplete="off">
          <input type="hidden" id="edit-testi-id">
          <div class="form-grid">
            <div class="f-group">
              <label class="f-label">Student Name <span class="req">*</span></label>
              <input name="studentName" class="f-ctrl" required placeholder="Full name">
            </div>
            <div class="f-group">
              <label class="f-label">Role / Profession <span class="req">*</span></label>
              <input name="studentRole" class="f-ctrl" required placeholder="e.g. B.Ed Graduate">
            </div>
            <div class="f-group form-row">
              <label class="f-label">Review Content <span class="req">*</span></label>
              <textarea name="content" class="f-ctrl" rows="4" required placeholder="Student's review…"></textarea>
            </div>
            <div class="f-group">
              <label class="f-label">Rating (1–5)</label>
              <select name="rating" class="f-ctrl">
                <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                <option value="4">⭐⭐⭐⭐ (4)</option>
                <option value="3">⭐⭐⭐ (3)</option>
                <option value="2">⭐⭐ (2)</option>
                <option value="1">⭐ (1)</option>
              </select>
            </div>
            <div class="f-group">
              <label class="f-label">Related Course</label>
              <select name="courseRef" id="testi-course-select" class="f-ctrl">
                <option value="">— None —</option>
              </select>
            </div>
            <div class="f-group form-row">
              <label class="f-label">Avatar Image</label>
              <input name="avatar" type="file" class="f-ctrl" accept="image/*">
              <span class="f-hint">Optional — leave blank to keep existing.</span>
            </div>
            <div class="f-group">
              <label class="f-check">
                <input name="isFeatured" type="checkbox">
                Featured (shown on homepage)
              </label>
            </div>
            <div class="f-group">
              <label class="f-check">
                <input name="isActive" type="checkbox" checked>
                Active (visible on website)
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-ft">
        <button class="btn btn-ghost" data-close="testi-modal">Cancel</button>
        <button class="btn btn-primary" id="testi-save-btn" type="button">Save Testimonial</button>
      </div>
    </div>
  </div>

  <script src="assets/js/admin-shared.js"></script>
  <script src="assets/js/admin-testimonials.js"></script>
</body>
</html>
