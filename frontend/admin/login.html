<!DOCTYPE html>
<!-- scolars-era/frontend/admin/login.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login — SCOLARS LIFT</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="login-pg">
  <div class="login-card">
    <div class="login-top">
      <div class="lg-ico">🎓</div>
      <h1>SCOLARS LIFT</h1>
      <p>Admin Panel — Sign In</p>
    </div>
    <div class="login-err" id="loginErr"></div>
    <div class="f-group" style="margin-bottom:.9rem">
      <label class="f-label" for="lemail">Email Address</label>
      <input id="lemail" type="email" class="f-ctrl"
             placeholder="admin@scolarsfix.com"
             autocomplete="email" required>
    </div>
    <div class="f-group" style="margin-bottom:1.4rem">
      <label class="f-label" for="lpass">Password</label>
      <div style="position: relative;">
        <input id="lpass" type="password" class="f-ctrl"
               placeholder="••••••••"
               autocomplete="current-password" required
               style="padding-right: 40px;">
        <span id="togglePass" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem; opacity: 0.6; user-select: none;" title="Toggle Password Visibility">
          👁️
        </span>
      </div>
    </div>
    <button id="loginBtn" class="btn btn-primary"
            style="width:100%;justify-content:center;padding:.7rem;font-size:.95rem">
      Sign In
    </button>
    <p style="text-align:center;margin-top:1.4rem;font-size:.8rem;color:var(--text-3)">
      <a href="/" style="color:var(--primary)">← Back to website</a>
    </p>
  </div>
</div>
<script>
"use strict";
// Redirect if already logged in
(function () {
  const t = localStorage.getItem("se_token") || localStorage.getItem("token");
  if (t) window.location.href = "/admin/index.html";
})();

document.getElementById("loginBtn").addEventListener("click", async () => {
  const btn   = document.getElementById("loginBtn");
  const err   = document.getElementById("loginErr");
  const email = document.getElementById("lemail").value.trim();
  const pass  = document.getElementById("lpass").value;

  err.classList.remove("show");
  if (!email || !pass) {
    err.textContent = "Please enter your email and password.";
    err.classList.add("show");
    return;
  }

  btn.disabled    = true;
  btn.textContent = "Signing in…";

  try {
    const res  = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password: pass }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Login failed");
    if (data.data?.role !== "admin")
      throw new Error("Access denied — admin accounts only.");
    localStorage.setItem("se_token", data.token);
    localStorage.setItem("token",    data.token);
    window.location.href = "/admin/index.html";
  } catch (e) {
    err.textContent = e.message;
    err.classList.add("show");
    btn.disabled    = false;
    btn.textContent = "Sign In";
  }
});

// Allow Enter key in password field
document.getElementById("lpass").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
});

// Toggle password visibility
document.getElementById("togglePass").addEventListener("click", function() {
  const passInput = document.getElementById("lpass");
  if (passInput.type === "password") {
    passInput.type = "text";
    this.style.opacity = "1";
  } else {
    passInput.type = "password";
    this.style.opacity = "0.6";
  }
});
</script>
</body>
</html>
