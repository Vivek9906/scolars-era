<!DOCTYPE html>
<!-- scolars-era/frontend/admin/universities.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage Universities — SCOLARS LIFT Admin</title>
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <button class="sb-toggle" id="sbToggle" aria-label="Toggle menu">☰</button>
  <div class="sb-veil" id="sbVeil"></div>

  <div class="admin-wrap">
    <!-- SIDEBAR -->
    <aside class="sb" id="adminSb">
      <div class="sb-logo">
        <span class="sb-logo-icon">🎓</span>
        <div>
          <div class="sb-logo-name">SCOLARS LIFT</div>
          <div class="sb-logo-sub">Admin Panel</div>
        </div>
      </div>
      <nav class="sb-nav">
        <div class="sb-section">Main Menu</div>
        <a href="/admin/index.html" class="sb-link">
          <span class="sb-icon">📊</span>Dashboard
        </a>
        <a href="/admin/contacts.html" class="sb-link">
          <span class="sb-icon">✉️</span>Contacts
        </a>
        <a href="/admin/courses.html" class="sb-link">
          <span class="sb-icon">📚</span>Courses
        </a>
        <a href="/admin/universities.html" class="sb-link active">
          <span class="sb-icon">🏛️</span>Universities
        </a>
        <a href="/admin/testimonials.html" class="sb-link">
          <span class="sb-icon">⭐</span>Testimonials
        </a>
        <div class="sb-section" style="margin-top:.75rem">Site</div>
        <a href="/" target="_blank" class="sb-link">
          <span class="sb-icon">🌐</span>View Website
        </a>
      </nav>
      <div class="sb-footer">
        <button class="btn-signout" id="btnOut">↩ Sign Out</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <header class="topbar">
        <h1 class="topbar-title">Manage Universities</h1>
        <div class="topbar-right">
          <span class="user-badge">
            <span>👤</span>
            <span id="adminName">Admin</span>
          </span>
        </div>
      </header>

      <div class="admin-content">
        <div class="s-card">
          <div class="s-head">
            <span class="s-title">
              🏛️ Partner Universities
              <span class="s-count" id="uni-count">0</span>
            </span>
            <button class="btn btn-primary" id="btnAddUni">+ Add University</button>
          </div>
          <div class="tbl-wrap">
            <table class="admin-tbl">
              <thead>
                <tr>
                  <th>Logo</th>
                  <th>Name</th>
                  <th>Country</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="unis-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- UNIVERSITY MODAL -->
  <div class="modal-overlay" id="uni-modal">
    <div class="modal-box modal-lg">
      <div class="modal-hd">
        <h2 id="uni-modal-title">Add University</h2>
        <button class="btn-close" data-close="uni-modal">✕</button>
      </div>
      <div class="modal-bd">
        <form id="uni-form" autocomplete="off">
          <input type="hidden" id="edit-uni-id">
          <div class="form-grid">
            <div class="f-group">
              <label class="f-label">Name <span class="req">*</span></label>
              <input name="name" class="f-ctrl" required placeholder="University name">
            </div>
            <div class="f-group">
              <label class="f-label">Country <span class="req">*</span></label>
              <input name="country" class="f-ctrl" required placeholder="e.g. India">
            </div>
            <div class="f-group">
              <label class="f-label">Website URL</label>
              <input name="websiteUrl" type="url" class="f-ctrl" placeholder="https://university.edu">
            </div>
            <div class="f-group">
              <label class="f-label">Partnership Type</label>
              <select name="partnershipType" class="f-ctrl">
                <option value="Academic">Academic</option>
                <option value="Research">Research</option>
                <option value="Industry">Industry</option>
                <option value="Exchange">Exchange</option>
              </select>
            </div>
            <div class="f-group form-row">
              <label class="f-label">Description</label>
              <textarea name="description" class="f-ctrl" rows="3" placeholder="Brief description…"></textarea>
            </div>
            <div class="f-group form-row">
              <label class="f-label">Logo Image</label>
              <input name="logo" type="file" class="f-ctrl" accept="image/*">
              <span class="f-hint">Optional — leave blank to keep existing logo.</span>
            </div>
            <div class="f-group">
              <label class="f-label">Sort Order</label>
              <input name="sortOrder" type="number" class="f-ctrl" value="99" min="0">
              <span class="f-hint">Lower = shown first</span>
            </div>
            <div class="f-group">
              <label class="f-check">
                <input name="isActive" type="checkbox" checked>
                Active (visible on website)
              </label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-ft">
        <button class="btn btn-ghost" data-close="uni-modal">Cancel</button>
        <button class="btn btn-primary" id="uni-save-btn" type="button">Save University</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/admin-shared.js"></script>
  <script src="/assets/js/admin-universities.js"></script>
</body>
</html>
